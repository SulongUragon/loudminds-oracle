<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOUDMINDS ORACLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --panel-2: #161616;
    --border: #1f1f1f;
    --gold: #b8932a;
    --gold-bright: #d4a843;
    --text: #e8e8e8;
    --muted: #6b6b6b;
    --green: #1db954;
    --red: #ff3b3b;
    --warn: #ffb84d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-rows: 56px 1fr 28px;
    height: 100vh;
  }
  /* TOP BAR */
  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 24px;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 3px;
    color: var(--gold-bright);
  }
  .logo span { color: var(--text); }
  .strategy-bar { display: flex; gap: 8px; flex: 1; }
  .strat-chip {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .strat-chip:hover { color: var(--text); border-color: var(--gold); }
  .strat-chip.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold-bright);
    font-weight: 700;
  }
  .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  /* MAIN */
  .main {
    display: grid;
    grid-template-columns: 360px 1fr 320px;
    overflow: hidden;
  }
  .panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }
  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--gold-bright);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-header .count {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0;
  }

  /* ALERT FEED */
  .feed { flex: 1; overflow-y: auto; }
  .alert {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
    animation: slideIn .3s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  .alert:hover { background: var(--panel-2); }
  .alert.selected { background: rgba(184, 147, 42, 0.08); border-left: 3px solid var(--gold); }
  .alert-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .alert-sym {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--text);
  }
  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .badge.long { background: var(--green); color: #000; }
  .badge.short { background: var(--red); color: #fff; }
  .alert-prices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
  }
  .price-cell { background: var(--panel-2); padding: 6px; border-radius: 2px; }
  .price-cell .label { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .price-cell .val { color: var(--text); font-weight: 700; margin-top: 2px; }
  .price-cell.stop .val { color: var(--red); }
  .price-cell.target .val { color: var(--green); }
  .alert-reason {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .alert-commentary {
    margin-top: 6px;
    font-size: 11px;
    color: var(--gold);
    line-height: 1.5;
    font-style: italic;
    opacity: 0.85;
  }
  .price-cell { cursor: pointer; position: relative; }
  .price-cell:hover .val::after { content: ' ✦'; font-size: 9px; opacity: 0.5; }
  .copy-toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #000; padding: 6px 14px;
    border-radius: 4px; font-size: 11px; font-family: 'Space Mono', monospace;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    z-index: 9999;
  }
  .copy-toast.show { opacity: 1; }
  .alert-meta {
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .conf { color: var(--gold-bright); }

  /* CHART */
  .chart-wrap { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chart-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .chart-symbol {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--gold-bright);
  }
  .chart-price { font-family: 'Space Mono', monospace; font-size: 18px; color: var(--text); }
  .chart-change { font-family: 'Space Mono', monospace; font-size: 12px; }
  .chart-change.up { color: var(--green); }
  .chart-change.down { color: var(--red); }
  #chart { flex: 1; }

  /* RIGHT PANEL - STATS + WATCHLIST */
  .stat-grid { padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
  }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--gold-bright);
    margin-top: 4px;
  }
  .watchlist-section { flex: 1; overflow-y: auto; padding: 0 14px 14px; }
  .wl-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
  }
  .wl-item:hover { background: var(--panel-2); }
  .wl-sym { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; }
  .wl-price { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
  .wl-price.live { color: var(--green); }

  /* BOTTOM BAR */
  .bottombar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .bottombar .item { display: flex; gap: 6px; }
  .bottombar .item b { color: var(--gold-bright); font-weight: 400; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 12px; }

  /* CONFIDENCE BAR */
  .conf-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .conf-fill { height: 100%; border-radius: 2px; transition: width .6s ease; }
  .conf-fill.high { background: var(--gold-bright); box-shadow: 0 0 8px var(--gold); }
  .conf-fill.mid  { background: var(--warn); }
  .conf-fill.low  { background: var(--muted); }

  /* HIGH-CONF ALERT GLOW */
  .alert.high-conf { box-shadow: inset 0 0 24px rgba(184,147,42,.06); }
  .alert.high-conf:not(.selected) { border-left: 3px solid var(--gold); }

  /* R:R BADGE */
  .rr-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: .5px;
  }
  .rr-badge.good { border-color: var(--green); color: var(--green); }

  /* TOAST NOTIFICATIONS */
  .toast-wrap {
    position: fixed; bottom: 40px; right: 18px; z-index: 100;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text);
    min-width: 200px;
    animation: toastIn .25s ease-out, toastOut .3s ease-in 2.7s forwards;
  }
  .toast-sym { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold-bright); margin-bottom: 2px; }
  @keyframes toastIn  { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(8px); } }

  /* SCAN PULSE */
  @keyframes scanPulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .scanning { animation: scanPulse 2s infinite; color: var(--green) !important; }
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">LOUDMINDS<span>·ORACLE</span></div>
    <div class="strategy-bar" id="strategyBar"></div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">CONNECTING</span></div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <!-- LEFT: ALERT FEED -->
    <section class="panel">
      <div class="panel-header">ALERT FEED <span class="count" id="alertCount">0</span></div>
      <div class="feed" id="feed">
        <div class="empty">Waiting for signals…</div>
      </div>
    </section>

    <!-- CENTER: CHART -->
    <section class="chart-wrap">
      <div class="chart-header">
        <div class="chart-symbol" id="chartSym">—</div>
        <div class="chart-price" id="chartPrice">$0.00</div>
        <div class="chart-change" id="chartChange"></div>
      </div>
      <div id="chart"></div>
    </section>

    <!-- RIGHT: STATS + WATCHLIST -->
    <section class="panel">
      <div class="panel-header">SESSION STATS</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Alerts</div><div class="stat-val" id="statAlerts">0</div></div>
        <div class="stat"><div class="stat-label">Scans</div><div class="stat-val" id="statScans">0</div></div>
        <div class="stat"><div class="stat-label">Symbols</div><div class="stat-val" id="statSym">0</div></div>
        <div class="stat"><div class="stat-label">Uptime</div><div class="stat-val" id="statUptime">0s</div></div>
      </div>
      <div class="panel-header" style="border-top:1px solid var(--border)">WATCHLIST <span class="count" id="wlCount">0</span></div>
      <div class="watchlist-section" id="watchlist"></div>
    </section>
  </main>

  <!-- BOTTOM -->
  <div class="copy-toast" id="copyToast"></div>
  <div class="toast-wrap" id="toastWrap"></div>
  <footer class="bottombar">
    <div class="item">DATA <b>TWELVE DATA</b></div>
    <div class="item">ENGINE <b id="engineStat">IDLE</b></div>
    <div class="item">LAST TICK <b id="lastTick">—</b></div>
    <div class="item" style="margin-left:auto">© LOUDMINDS · ORACLE v1.0</div>
  </footer>
</div>

<script>
// ============ CONFIG ============
// PRODUCTION: Replace the localhost URL below with your Railway backend URL
// Example: const API = 'https://oracle-api.loudminds.club';
const API = window.ORACLE_API || 'https://loudminds-oracle-production.up.railway.app';
const WS_URL = API.replace(/^http/, 'ws') + '/ws';

// ============ STATE ============
let alerts = [];
let watchlist = [];
let activeStrategies = [];
let selectedSymbol = null;
let livePrices = new Map();
let chart, candleSeries;

// ============ CHART ============
function initChart() {
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    layout: { background: { color: '#0a0a0a' }, textColor: '#6b6b6b' },
    grid: { vertLines: { color: '#161616' }, horzLines: { color: '#161616' } },
    timeScale: { borderColor: '#1f1f1f', timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderColor: '#1f1f1f' },
    crosshair: { mode: 0 },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#1db954', downColor: '#ff3b3b',
    borderUpColor: '#1db954', borderDownColor: '#ff3b3b',
    wickUpColor: '#1db954', wickDownColor: '#ff3b3b',
  });
  new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight })).observe(el);
}

async function loadChart(symbol) {
  selectedSymbol = symbol;
  document.getElementById('chartSym').textContent = symbol;
  try {
    const res = await fetch(`${API}/api/candles/${symbol}`);
    const candles = await res.json();
    const data = candles.map(c => ({
      time: Math.floor(new Date(c.time).getTime() / 1000),
      open: c.open, high: c.high, low: c.low, close: c.close,
    }));
    candleSeries.setData(data);
    if (data.length) {
      const last = data[data.length - 1];
      const first = data[0];
      const change = ((last.close - first.open) / first.open) * 100;
      document.getElementById('chartPrice').textContent = `$${last.close.toFixed(2)}`;
      const chEl = document.getElementById('chartChange');
      chEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
      chEl.className = 'chart-change ' + (change >= 0 ? 'up' : 'down');
    }
  } catch (e) { console.error(e); }
}

// ============ RENDER ============
function renderAlerts() {
  document.getElementById('alertCount').textContent = alerts.length;
  const feed = document.getElementById('feed');
  if (!alerts.length) { feed.innerHTML = '<div class="empty">Waiting for signals…</div>'; return; }
  feed.innerHTML = alerts.map(a => {
    const rr = (a.target - a.entry) / (a.entry - a.stop);
    const rrGood = rr >= 2;
    const conf = Math.round(a.confidence);
    const confClass = conf >= 85 ? 'high' : conf >= 60 ? 'mid' : 'low';
    const highConf = conf >= 85;
    return `
    <div class="alert ${a.symbol === selectedSymbol ? 'selected' : ''} ${highConf ? 'high-conf' : ''}" data-sym="${a.symbol}">
      <div class="alert-row1">
        <div class="alert-sym">${a.symbol}</div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="rr-badge ${rrGood ? 'good' : ''}">R:R ${rr.toFixed(1)}</span>
          <div class="badge ${a.side.toLowerCase()}">${a.side}</div>
        </div>
      </div>
      <div class="alert-prices">
        <div class="price-cell" data-copy="${a.entry.toFixed(2)}"><div class="label">Entry</div><div class="val">$${a.entry.toFixed(2)}</div></div>
        <div class="price-cell stop" data-copy="${a.stop.toFixed(2)}"><div class="label">Stop</div><div class="val">$${a.stop.toFixed(2)}</div></div>
        <div class="price-cell target" data-copy="${a.target.toFixed(2)}"><div class="label">Target</div><div class="val">$${a.target.toFixed(2)}</div></div>
      </div>
      <div class="alert-reason">${a.reason}</div>
      ${a.commentary ? `<div class="alert-commentary">${a.commentary}</div>` : ''}
      <div class="conf-bar"><div class="conf-fill ${confClass}" style="width:${Math.min(conf,100)}%"></div></div>
      <div class="alert-meta">
        <span>${a.strategyName}</span>
        <span class="conf">${conf}% · ${new Date(a.timestamp).toLocaleTimeString()}</span>
      </div>
    </div>`;
  }).join('');
  feed.querySelectorAll('.alert').forEach(el => {
    el.addEventListener('click', () => loadChart(el.dataset.sym).then(renderAlerts));
  });
  feed.querySelectorAll('.price-cell[data-copy]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      navigator.clipboard.writeText(el.dataset.copy);
      const t = document.getElementById('copyToast');
      t.textContent = `Copied $${el.dataset.copy}`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1200);
    });
  });
}

function renderWatchlist() {
  document.getElementById('wlCount').textContent = watchlist.length;
  const el = document.getElementById('watchlist');
  el.innerHTML = watchlist.map(sym => {
    const p = livePrices.get(sym);
    return `<div class="wl-item" data-sym="${sym}">
      <span class="wl-sym">${sym}</span>
      <span class="wl-price ${p ? 'live' : ''}">${p ? '$' + p.toFixed(2) : '—'}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.wl-item').forEach(it => {
    it.addEventListener('click', () => loadChart(it.dataset.sym));
  });
}

function renderStrategies(list) {
  const bar = document.getElementById('strategyBar');
  bar.innerHTML = list.map(s => `<div class="strat-chip ${s.active ? 'active' : ''}" data-key="${s.key}">${s.name}</div>`).join('');
  bar.querySelectorAll('.strat-chip').forEach(chip => {
    chip.addEventListener('click', async () => {
      chip.classList.toggle('active');
      const active = [...bar.querySelectorAll('.strat-chip.active')].map(c => c.dataset.key);
      if (!active.length) { chip.classList.add('active'); return; }
      await fetch(`${API}/api/strategies`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ active }),
      });
      activeStrategies = active;
    });
  });
}

function updateStats(stats) {
  if (!stats) return;
  document.getElementById('statAlerts').textContent = stats.alerts || 0;
  document.getElementById('statScans').textContent = stats.scans || 0;
  document.getElementById('statSym').textContent = stats.watchlistSize || 0;
  const u = stats.uptime || 0;
  document.getElementById('statUptime').textContent =
    u < 60 ? `${u}s` : u < 3600 ? `${Math.floor(u/60)}m` : `${Math.floor(u/3600)}h${Math.floor((u%3600)/60)}m`;
  const eng = document.getElementById('engineStat');
  eng.textContent = 'SCANNING';
  eng.classList.add('scanning');
}

// ============ TOAST ============
function showToast(a) {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast';
  const rr = ((a.target - a.entry) / (a.entry - a.stop)).toFixed(1);
  t.innerHTML = `<div class="toast-sym">⚡ ${a.symbol}</div>${a.side} · $${a.entry.toFixed(2)} · ${Math.round(a.confidence)}% conf · R:R ${rr}`;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ============ AUDIO ============
function ding() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.1;
    o.start(); o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    o.stop(ctx.currentTime + 0.3);
  } catch (e) {}
}

// ============ WEBSOCKET ============
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('connDot').classList.add('live');
    document.getElementById('connText').textContent = 'LIVE';
  };
  ws.onclose = () => {
    document.getElementById('connDot').classList.remove('live');
    document.getElementById('connText').textContent = 'RECONNECTING';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'snapshot') {
      alerts = msg.data.alerts || [];
      updateStats(msg.data.stats);
      renderAlerts();
    } else if (msg.type === 'alert') {
      alerts.unshift(msg.data);
      if (alerts.length > 200) alerts.pop();
      ding();
      showToast(msg.data);
      if (!selectedSymbol) loadChart(msg.data.symbol);
      renderAlerts();
    } else if (msg.type === 'alert_update') {
      const idx = alerts.findIndex(a => a.id === msg.data.id);
      if (idx !== -1) { alerts[idx] = msg.data; renderAlerts(); }
    } else if (msg.type === 'tick') {
      livePrices.set(msg.data.symbol, msg.data.price);
      document.getElementById('lastTick').textContent = `${msg.data.symbol} $${msg.data.price.toFixed(2)}`;
      renderWatchlist();
    }
  };
}

// ============ BOOT ============
async function boot() {
  initChart();
  const [wl, strats] = await Promise.all([
    fetch(`${API}/api/watchlist`).then(r => r.json()),
    fetch(`${API}/api/strategies`).then(r => r.json()),
  ]);
  watchlist = wl;
  renderWatchlist();
  renderStrategies(strats);
  if (wl.length) loadChart(wl[0]);
  connectWS();
  setInterval(async () => {
    const h = await fetch(`${API}/api/health`).then(r => r.json()).catch(() => null);
    if (h) updateStats(h);
  }, 5000);
}
boot();
</script>
</body>
</html>
